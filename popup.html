<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Claude Limit Runner</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="shell">
      <header class="brand">
        <div class="mark">✶</div>
        <div class="brandText">
          <h1>Claude Limit Runner</h1>
          <p id="usageSummary">Checking usage…</p>
        </div>
        <button id="refreshButton" class="refresh" type="button" title="Refresh usage" aria-label="Refresh usage">
          <svg class="refreshIcon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12a9 9 0 1 1-2.64-6.36"></path>
            <path d="M21 3v6h-6"></path>
          </svg>
        </button>
      </header>

      <div id="updateBanner" class="updateBanner upToDate">
        <span id="updateBannerText">Checking version…</span>
        <a id="updateBannerLink" href="https://github.com/brianyeap/claude-automate" target="_blank" rel="noopener" hidden>git pull ↗</a>
      </div>

      <section class="status" aria-live="polite">
        <div>
          <span class="label">Current session</span>
          <strong id="sessionUsage">-</strong>
        </div>
        <div>
          <span class="label">Next reset</span>
          <strong id="resetTime">-</strong>
        </div>
      </section>

      <section class="pageStatus" aria-live="polite">
        <span id="pageStatusDot" class="statusDot"></span>
        <div>
          <span class="label">Claude page</span>
          <strong id="pageStatusText">Checking page…</strong>
          <p id="projectText" class="projectText">Project unavailable</p>
        </div>
      </section>

      <label class="field">
        <span>Project</span>
        <select id="projectSelect">
          <option value="">Auto (current page)</option>
        </select>
        <small id="targetHint" class="targetHint"></small>
      </label>

      <label class="field">
        <span>Prompt to send</span>
        <textarea id="promptInput" rows="7" placeholder="Paste the prompt Claude should run after the reset…"></textarea>
      </label>

      <div class="grid">
        <label class="field">
          <span>Manual time</span>
          <input id="manualTime" type="datetime-local">
        </label>
      </div>

      <div class="actions">
        <button id="useResetButton" class="primary" type="button">Use next limit reset</button>
        <button id="scheduleButton" type="button">Schedule manual time</button>
      </div>

      <section class="nextRun">
        <span class="label">Scheduled run</span>
        <strong id="scheduledText">Nothing scheduled</strong>
        <button id="cancelButton" class="ghost" type="button">Cancel</button>
      </section>

    </main>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="popup.js" type="module"></script>
  </body>
</html>
